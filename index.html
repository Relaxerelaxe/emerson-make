<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emerson Make 1.0</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg1:#ffe6f2;--bg2:#e4e2ff;--ink:#3a2650;--card:rgba(255,255,255,.82);--acc:#ff4f9a;--acc2:#8b6cff;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1840;--bg2:#171b3d;--ink:#fdeaff;--card:rgba(48,32,80,.82);--chip:#4a3873}}
:root[data-theme="dark"]{--bg1:#2b1840;--bg2:#171b3d;--ink:#fdeaff;--card:rgba(48,32,80,.82);--chip:#4a3873}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:600;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
#menu{align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.fl{position:absolute;font-size:28px;animation:fl 7s ease-in-out infinite;opacity:.8}
@keyframes fl{50%{transform:translateY(-26px) rotate(14deg)}}
.av{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 30%;border:6px solid #fff;box-shadow:0 10px 40px rgba(255,79,154,.45),0 0 0 8px rgba(255,79,154,.18);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.03)}}
h1{margin:6px 0 0;font-size:clamp(44px,15vw,76px);line-height:.95;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:2px 16px;font-size:20px;margin-top:6px;transform:rotate(-4deg)}
.big{background:linear-gradient(135deg,var(--acc),#ff8a5c);color:#fff;font-size:26px;font-weight:800;padding:14px 56px;border-radius:99px;box-shadow:0 8px 0 #c42d74,0 14px 24px rgba(196,45,116,.35);transition:transform .1s,box-shadow .1s;margin-top:10px}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #c42d74}
.sm{background:var(--card);border-radius:99px;padding:8px 18px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
#score{font-size:22px;font-weight:800;background:var(--card);padding:2px 16px;border-radius:99px}
#wrap{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
#stage{position:relative;width:min(100cqw,calc(100cqh*.7235));aspect-ratio:738/1020;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:0 12px 36px rgba(60,20,90,.35);border:4px solid #fff;box-sizing:border-box;background:#888}
.l{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#photo{object-fit:fill}
#hairA,#beardA{mix-blend-mode:color}#hairB,#beardB{mix-blend-mode:screen}
#lips{mix-blend-mode:color;border-radius:50%;filter:blur(1.5px);left:40.5%;top:61.5%;width:21%;height:4.6%;inset:auto;position:absolute}
#blush,#shadow{mix-blend-mode:multiply}
#glow{mix-blend-mode:soft-light;background:radial-gradient(ellipse at 48% 38%,rgba(255,255,255,.9),transparent 60%);opacity:0;transition:opacity 1.2s}
#grime.on{pointer-events:auto;cursor:grab;touch-action:none}
.pim{position:absolute;width:7.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;transition:all .35s;background:radial-gradient(circle at 38% 32%,#fff8d6 0 14%,transparent 16%),radial-gradient(circle,#ff9a9a,#d6403f 72%);box-shadow:0 0 0 2px rgba(214,64,63,.35),0 2px 4px rgba(0,0,0,.3);animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{transform:translate(-50%,-50%) scale(1.14)}}
.pim.s1{animation:none;width:5%;background:radial-gradient(circle,rgba(190,50,60,.8),rgba(190,50,60,0) 70%);box-shadow:none}
.pim.s2{animation:none;opacity:0;transform:translate(-50%,-50%) scale(.2)}
#pimples.on .pim{pointer-events:auto;cursor:pointer}
#pimples.on .pim::after{content:"";position:absolute;inset:-60%}
#hint{text-align:center;font-size:15px;padding:6px 14px 0;min-height:22px}
#tabs{display:flex;gap:6px;padding:6px 10px 0;overflow-x:auto;justify-content:center}
.tab{flex:none;background:var(--card);border-radius:16px 16px 0 0;padding:6px 12px;font-size:15px}
.tab.sel{background:var(--acc);color:#fff}
#panel{background:var(--card);padding:10px 12px 14px;max-height:34dvh;overflow-y:auto;backdrop-filter:blur(8px)}
.lab{font-size:13px;opacity:.75;margin:2px 4px}
.row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.chip{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:var(--chip);font-size:23px;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .12s}
.chip.sel{outline:4px solid var(--acc);transform:scale(1.1)}
.tool{border-radius:18px;width:auto;height:auto;padding:8px 14px;font-size:16px}
#modal{position:absolute;inset:0;background:rgba(30,10,50,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal.on{display:flex}
.box{background:var(--bg1);color:var(--ink);border-radius:28px;padding:26px 30px;text-align:center;max-width:80vw;animation:bob 3s infinite}
.stars{font-size:38px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

{n:'Boné',e:'🧢',s:'<path d="M170 225Q180 40 370 35Q560 40 585 225Q500 190 370 190Q240 190 170 225Z" fill="#e63946"/><path d="M150 215Q370 170 600 215Q610 245 580 240Q370 205 160 245Q130 240 150 215Z" fill="#b5202d"/>'},
{n:'Fones',e:'🎧',s:'<path d="M165 420Q165 95 370 85Q575 95 580 420" fill="none" stroke="#2b2b3a" stroke-width="18"/><rect x="138" y="380" width="52" height="120" rx="24" fill="#ff4f9a"/><rect x="555" y="380" width="52" height="120" rx="24" fill="#ff4f9a"/>'}];
const FT=[{n:'Normal',e:'∅',f:''},{n:'Vivo',e:'🌈',f:'saturate(1.35) contrast(1.05)'},{n:'Suave',e:'🌸',f:'brightness(1.08) contrast(.92) saturate(1.1)'},{n:'Vintage',e:'📷',f:'sepia(.55) contrast(1.05)'},{n:'P&B',e:'🖤',f:'grayscale(1)'}];
const TABS=[['pele','🧼','Pele'],['cabelo','💇','Cabelo'],['barba','🧔','Barba'],['make','💄','Make'],['estilo','🕶️','Estilo']];
const R={cabelo:[{k:'hair',l:'Cor do cabelo',i:H}],barba:[{k:'beard',l:'Cor da barba',i:H}],make:[{k:'lips',l:'Batom',i:LP},{k:'blush',l:'Blush',i:BL},{k:'shadow',l:'Sombra',i:SH}],estilo:[{k:'acc',l:'Acessório',i:AA},{k:'filt',l:'Filtro',i:FT}]};
const HINT={pele:{pop:'Toque nas espinhas para estourar! 💥',clean:'Esfregue a esponja no rosto para limpar a sujeira 🧽',cream:'Toque nas marcas vermelhas para passar creme 🧴'},cabelo:'Escolha a cor do cabelo',barba:'Escolha a cor da barba',make:'Hora da maquiagem ✨',estilo:'Acessórios e filtros'};
/* ---------- estado ---------- */
let S,changed,score,tab='pele',tool='pop',pims=[],maxClean=0,grimeTotal=1;
const fx=$('fx');
function addScore(n){score+=n;$('score').textContent='⭐ '+score}
function tint(a,b,it){const A=$(a),B=$(b);if(it.c){A.style.background=B.style.background=it.c;A.style.opacity=1;B.style.opacity=it.l}else A.style.opacity=B.style.opacity=0}
const AP={hair:it=>tint('hairA','hairB',it),beard:it=>tint('beardA','beardB',it),
lips:it=>{$('lips').style.background=it.c||'none';$('lips').style.opacity=it.c?.8:0},
blush:it=>{$('blush').style.background=it.c?`radial-gradient(ellipse 13% 7% at 33% 49%,${it.c},transparent),radial-gradient(ellipse 13% 7% at 69% 51%,${it.c},transparent)`:'none';$('blush').style.opacity=.7},
shadow:it=>{$('shadow').style.background=it.c?`radial-gradient(ellipse 9% 3.6% at 40.7% 40.5%,${it.c},transparent),radial-gradient(ellipse 9% 3.6% at 62.6% 41.5%,${it.c},transparent)`:'none';$('shadow').style.opacity=.75},
acc:it=>{$('acc').innerHTML=it.s||''},filt:it=>{$('stage').style.filter=it.f||''}};
const LST={hair:H,beard:H,lips:LP,blush:BL,shadow:SH,acc:AA,filt:FT};
function setOpt(k,i,quiet){S[k]=i;AP[k](LST[k][i]);if(!quiet){sfx.spark();if(i&&!changed[k]){changed[k]=1;addScore(5)}burst(50,35,['✨','💖'],5,60);render()}}
function burst(px,py,items,n,dist){for(let i=0;i<n;i++){const e=document.createElement('i');e.textContent=items[i%items.length];e.style.cssText=`position:absolute;left:${px}%;top:${py}%;font-style:normal;font-size:${12+Math.random()*12}px;pointer-events:none`;fx.append(e);const a=Math.random()*6.28,d=dist*(.5+Math.random());e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.3)`,opacity:0}],{duration:600+Math.random()*300,easing:'ease-out'}).onfinish=()=>e.remove()}}
function float(px,py,t){const e=document.createElement('b');e.textContent=t;e.style.cssText=`position:absolute;left:${px}%;top:${py}%;color:#fff;font-size:22px;text-shadow:0 2px 6px #c42d74,0 0 3px #c42d74;pointer-events:none`;fx.append(e);e.animate([{transform:'translate(-50%,0)',opacity:1},{transform:'translate(-50%,-60px)',opacity:0}],{duration:900}).onfinish=()=>e.remove()}
/* ---------- espinhas ---------- */
const PP=[[54.9,30.1],[41,31],[64,33],[47,27],[34,48],[68,50]];
function mkPims(){const P=$('pimples');P.innerHTML='';pims=PP.map(([x,y],i)=>{const d=document.createElement('div');d.className='pim';d.style.left=x+'%';d.style.top=y+'%';d.style.animationDelay=-i*.3+'s';const o={d,x,y,s:0};d.onpointerdown=e=>{e.preventDefault();hit(o)};P.append(d);return o})}
function hit(o){if(tool==='pop'&&o.s===0){o.s=1;o.d.className='pim s1';sfx.pop();navigator.vibrate&&navigator.vibrate(25);burst(o.x,o.y,['🟡','⚪','💦'],9,50);float(o.x,o.y-4,'+20');addScore(20)}
else if(tool==='cream'&&o.s===1){o.s=2;o.d.className='pim s2';sfx.spark();burst(o.x,o.y,['✨','🤍'],7,40);float(o.x,o.y-4,'+15');addScore(15);if(pims.every(p=>p.s===2)){float(50,20,'Pele perfeita!');sfx.win()}}
else{sfx.click();o.d.animate([{marginLeft:'-4px'},{marginLeft:'4px'},{marginLeft:0}],{duration:200});hint(tool==='pop'?'Essa já foi estourada. Use o creme 🧴':'Estoure primeiro, depois passe o creme')}}
/* ---------- sujeira ---------- */
const gc=$('grime'),gx=gc.getContext('2d',{willReadFrequently:true});
function mkGrime(){gx.globalCompositeOperation='source-over';gx.clearRect(0,0,369,510);for(let i=0;i<46;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random()),x=192+Math.cos(a)*r*125,y=205+Math.sin(a)*r*165,rad=14+Math.random()*22,g=gx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(105,70,35,.55)');g.addColorStop(1,'rgba(105,70,35,0)');gx.fillStyle=g;gx.beginPath();gx.arc(x,y,rad,0,6.28);gx.fill()}
maxClean=0;grimeTotal=cnt();$('glow').style.opacity=0}
function cnt(){const d=gx.getImageData(0,0,369,510).data;let c=0;for(let i=3;i<d.length;i+=16)if(d[i]>30)c++;return c||1}
let down=false,lt=0,lc=0;
function gpos(e){const r=gc.getBoundingClientRect();return[(e.clientX-r.left)/r.width*369,(e.clientY-r.top)/r.height*510]}
function wipe(e){const[x,y]=gpos(e);gx.globalCompositeOperation='destination-out';gx.beginPath();gx.arc(x,y,24,0,6.28);gx.fill();const n=performance.now();if(n-lt>140){lt=n;sfx.swoosh();burst(x/369*100,y/510*100,['🫧'],1,30)}if(n-lc>300){lc=n;const p=Math.min(100,Math.round((1-cnt()/grimeTotal)*100));if(p>maxClean){addScore(p-maxClean);maxClean=p}hint('Limpeza '+p+'%'+(p>=90?' ✨ Rosto brilhando!':''));if(p>=90&&$('glow').style.opacity!=1){$('glow').style.opacity=1;sfx.win();burst(50,40,['✨','⭐','💎'],14,110)}}}
gc.onpointerdown=e=>{down=true;gc.setPointerCapture(e.pointerId);wipe(e)};gc.onpointermove=e=>{if(down)wipe(e)};gc.onpointerup=gc.onpointercancel=()=>down=false;
/* ---------- UI ---------- */
function hint(t){$('hint').textContent=t}
function layers(){const p=tab==='pele';$('pimples').classList.toggle('on',p&&tool!=='clean');gc.classList.toggle('on',p&&tool==='clean');hint(p?HINT.pele[tool]:HINT[tab])}
function render(){$('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t[0]===tab?'sel':''}" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join('');
let h='';if(tab==='pele'){h='<div class="row">'+[['pop','🔴 Espinhas'],['clean','🧽 Limpar'],['cream','🧴 Creme']].map(t=>`<button class="chip tool ${tool===t[0]?'sel':''}" data-tool="${t[0]}">${t[1]}</button>`).join('')+'<button class="chip tool" data-tool="reset">🔄 Refazer pele</button></div>'}
else R[tab].forEach(r=>{h+=`<div class="lab">${r.l}</div><div class="row">`+r.i.map((it,i)=>`<button class="chip ${S[r.k]===i?'sel':''}" aria-label="${it.n}" data-k="${r.k}" data-i="${i}" style="${it.c?'background:'+it.c:''}">${it.e||(it.c?'':'∅')}</button>`).join('')+'</div>'});
$('panel').innerHTML=h;layers()}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){sfx.click();tab=b.dataset.t;render()}};
$('panel').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k)return setOpt(b.dataset.k,+b.dataset.i);const t=b.dataset.tool;sfx.click();if(t==='reset'){mkPims();mkGrime();layers();return}tool=t;render()};
function reset(){S={hair:0,beard:0,lips:0,blush:0,shadow:0,acc:0,filt:0};changed={};score=0;addScore(0);for(const k in S)AP[k](LST[k][0]);tab='pele';tool='pop';mkPims();mkGrime();render()}
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
$('play').onclick=()=>{ac();if(musicOn)music(true);mg.gain.value=.3;sfx.click();reset();go('game')};
$('home').onclick=()=>{sfx.click();if(mg)mg.gain.value=.5;go('menu')};
$('mus').onclick=()=>{ac();musicOn=!musicOn;$('mus').textContent='🎵 Música: '+(musicOn?'ligada':'desligada');music(musicOn);sfx.click()};
$('fin').onclick=()=>{const healed=pims.filter(p=>p.s===2).length,ch=Object.keys(changed).length;const n=Math.min(100,Math.round(healed/pims.length*30+maxClean*.3+ch*8));const st=Math.max(1,Math.round(n/20));$('st').textContent='⭐'.repeat(st)+'☆'.repeat(5-st);$('mt').textContent='Nota '+n+'/100';$('mp').textContent=n>=80?'Make perfeito! O Emerson arrasou! 💖':n>=50?'Ficou lindo! Dá pra caprichar mais ✨':'Ainda tem espinha e sujeira por aí. Bora cuidar da pele! 🧼';sfx.win();$('modal').classList.add('on')};
$('back').onclick=()=>$('modal').classList.remove('on');
$('again').onclick=()=>{$('modal').classList.remove('on');reset()};
document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():AC.resume()}});
</script></body></html>
